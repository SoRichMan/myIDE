[workspace]
resolver = "2"
members = [
    "crates/ide-core",
    "crates/ide-ui",
    "crates/ide-lsp",
    "crates/ide-dap",
    "crates/ide-search",
    "crates/ide-git",
    # 扩展机制：宿主 + 内置扩展
    "crates/ide-ext",
    "crates/ext-cpp-highlight",
    "crates/ext-theme-vscode",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
eframe = "0.28"
egui = "0.28"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
